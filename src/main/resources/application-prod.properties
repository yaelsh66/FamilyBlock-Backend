server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${DATABASE_URL}

spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional but recommended
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}

openai.api.key=${OPEN_AI_KEY}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.model=${OPENAI_MODEL:gpt-4o}

# application.properties
gemini.api.key=${GEMINI_KEY}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/}
gemini.model=${GEMINI_MODEL:models/gemini-2.5-flash}

# Firebase Admin credentials. Prefer JSON content on hosted platforms.
firebase.admin.service-account-json=${FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON:}
firebase.admin.service-account=${FIREBASE_ADMIN_SERVICE_ACCOUNT_PATH:src/main/resources/firebase/serviceAccountKey.json}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

downloadsAgent.path=${DOWNLOADS_PATH}
downloadsUI.path=${DOWNLOADS_UI_PATH}
downloadsAgentInstaller.path=${DOWNLOADS_AGENT_INSTALLER_PATH}


logging.level.org.springframework.boot.context.config=DEBUG
